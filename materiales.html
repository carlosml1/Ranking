<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking Materiales</title>
  <link rel="stylesheet" href="styles.css?v=12">
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>

      <div>
        <h1>Ranking Materiales</h1>
        <p>Clasificación de materiales</p>
      </div>
    </div>

    <div class="top-actions">

      <button id="drugBtn" class="secondary-btn" type="button">
        Droga
      </button>

      <button id="carPartsRankingBtn" class="secondary-btn" type="button">
        Ranking Partes de Coche
      </button>

      <div id="statusPill" class="status-pill">
        Solo lectura
      </div>

    </div>
  </header>

  <main class="app-shell">

    <section class="rankings-grid">

      <article class="ranking-card">
        <div class="table-header">
          <div>
            <span class="eyebrow">RANKING</span>
            <h3>Materiales</h3>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Pos.</th>
                <th>Nombre</th>
              </tr>
            </thead>

            <tbody id="materialsRankingBody">
              <tr>
                <td colspan="2" class="empty">
                  Cargando…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>

    </section>

  </main>

  <script>
    document.getElementById("drugBtn")?.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    document.getElementById("carPartsRankingBtn")?.addEventListener("click", () => {
      window.location.href = "partes.html";
    });
  </script>

</body>

</html>
